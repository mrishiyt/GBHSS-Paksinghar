<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBHSS Paksinghar - Official Portal</title>
    <style>
        /* General Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Main Login Box */
        .login-container {
            background: #fff;
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            width: 100%;
            max-width: 400px;
            animation: fadeIn 1s ease-in-out;
        }

        /* School Logo/Name Area */
        .school-header img {
            width: 80px; /* School Logo Placeholder */
            margin-bottom: 15px;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            color: #777;
            margin-bottom: 30px;
            font-size: 15px;
        }

        /* Google Login Button */
        .google-btn {
            background-color: #4285F4;
            color: white;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s, transform 0.2s;
            text-decoration: none; /* Link ko button jaisa banane ke liye */
        }
        .google-btn:hover {
            background-color: #357ae8;
            transform: translateY(-2px);
        }
        .google-icon {
            margin-right: 15px;
            background: white;
            padding: 5px;
            border-radius: 4px;
            display: flex;
        }

        /* Footer Text */
        .footer-text {
            margin-top: 20px;
            font-size: 12px;
            color: #aaa;
        }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 500px) {
            .login-container { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="school-header">
            <!-- Yahan aap apne school ki photo ka link laga sakte hain -->
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Emblem_of_Sindh.svg/1200px-Emblem_of_Sindh.svg.png" alt="Sindh Govt Logo">
            <h2>GBHSS Paksinghar</h2>
            <p>Student Admission Portal 2026-27</p>
        </div>

        <!-- Asli Google Login abhi backend setup maangta hai, 
             filhal yeh button dashboard.html par le kar jayega -->
        <a href="dashboard.html" class="google-btn">
            <span class="google-icon">
                <svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="18px" height="18px" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.4 1.2 8.8 3.3l6.6-6.6C34.2 3 29.4 0 24 0 14.8 0 7.1 6.1 4.1 14.4l6.8 5.3C12.8 13.6 18.2 9.5 24 9.5z"/><path fill="#4285F4" d="M46.9 24.5c0-1.7-.1-3.4-.4-5H24v10h12.6c-.6 3.3-2.4 6-5.1 7.8l6.9 5.3c4-3.7 6.3-9.1 6.3-15.6z"/><path fill="#FBBC05" d="M10.9 28.1c-1.3-3.6-1.3-7.5 0-11.1l-6.8-5.3C1.8 15.2 0 19.5 0 24s1.8 8.8 4.1 12.3l6.8-5.3z"/><path fill="#34A853" d="M24 48c6.5 0 12-2.2 16-6l-6.9-5.3c-2.2 1.5-5 2.4-9.1 2.4-5.8 0-11.2-4-13.1-9.4l-6.8 5.3C7.1 41.9 14.8 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
            </span>
            Continue with Google
        </a>

        <div class="footer-text">
            Powered by GBHSS Paksinghar IT Dept | Managed on GitHub
        </div>
    </div>

</body>
</html>
