<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBHSS Paksinghar - Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --accent: #38bdf8;
            --dark: #0f172a;
            --light: #f8fafc;
            --gray: #64748b;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--dark);
            color: var(--light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .bg-mesh {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(at 10% 20%, rgba(2, 132, 199, 0.25) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.8) 0px, transparent 100%);
            z-index: -1;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            z-index: 1;
        }

        .panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            display: none;
            animation: fadeIn 0.5s ease-in-out forwards;
        }

        .panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .emblem-badge {
            width: 65px; height: 65px;
            background: rgba(2, 132, 199, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 18px;
            display: flex; justify-content: center; align-items: center;
            margin: 0 auto 12px;
        }

        .emblem-badge img {
            width: 35px; height: auto;
        }

        .brand-header h1 {
            font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 4px;
        }

        .brand-header p {
            font-size: 13px; color: var(--gray);
        }

        .auth-switch {
            display: flex; background: rgba(255, 255, 255, 0.04);
            border-radius: 12px; padding: 4px; margin-bottom: 20px;
        }

        .switch-btn {
            flex: 1; padding: 10px; border: none; background: transparent;
            color: var(--gray); font-weight: 600; font-size: 13px;
            border-radius: 8px; cursor: pointer; transition: var(--transition);
        }

        .switch-btn.active {
            background: var(--primary); color: #fff;
        }

        .input-group {
            position: relative; margin-bottom: 15px;
        }

        .input-group i {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            color: var(--gray); font-size: 14px;
        }

        .input-field {
            width: 100%; background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px; padding: 12px 15px 12px 42px;
            color: #fff; font-size: 14px; outline: none; transition: var(--transition);
        }

        .input-field:focus {
            border-color: var(--primary); background: rgba(2, 132, 199, 0.05);
        }

        select.input-field {
            appearance: none; cursor: pointer;
        }
        select.input-field option { background: var(--dark); color: #fff; }

        .file-box {
            border: 1px dashed rgba(255, 255, 255, 0.2); border-radius: 10px;
            padding: 12px; text-align: center; background: rgba(255, 255, 255, 0.02);
            position: relative; cursor: pointer;
        }
        .file-box input {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
        }
        .file-box span { font-size: 12.5px; color: var(--gray); }

        .btn-primary {
            width: 100%; background: var(--primary); color: #fff; border: none;
            padding: 12px; border-radius: 10px; font-weight: 600; font-size: 14px;
            cursor: pointer; transition: var(--transition); margin-top: 5px;
        }
        .btn-primary:hover { background: var(--primary-dark); }

        .divider {
            text-align: center; margin: 18px 0; color: var(--gray); font-size: 11px; text-transform: uppercase;
        }

        .btn-google {
            width: 100%; background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1); color: #fff;
            padding: 11px; border-radius: 10px; font-weight: 600; font-size: 13px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-google img { width: 16px; height: 16px; }
    </style>
</head>
<body>

    <div class="bg-mesh"></div>

    <div class="app-container">
        <!-- 1. LOGIN / SIGNUP PANEL -->
        <div id="authPanel" class="panel active">
            <div class="brand-header">
                <div class="emblem-badge">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Emblem_of_Sindh.svg/1200px-Emblem_of_Sindh.svg.png" alt="Logo">
                </div>
                <h1>GBHSS Paksinghar</h1>
                <p>Institutional Portal & Admission System</p>
            </div>

            <div class="auth-switch">
                <button class="switch-btn active" onclick="switchTab('login', event)">Sign In</button>
                <button class="switch-btn" onclick="switchTab('signup', event)">Register</button>
            </div>

            <form id="loginForm" onsubmit="goToAdmission(event)">
                <div class="input-group">
                    <input type="email" class="input-field" placeholder="Email Address" required>
                    <i class="fa-regular fa-envelope"></i>
                </div>
                <div class="input-group">
                    <input type="password" class="input-field" placeholder="Password" required>
                    <i class="fa-regular fa-lock"></i>
                </div>
                <button type="submit" class="btn-primary">Sign In to Portal</button>
            </form>

            <form id="signupForm" onsubmit="goToAdmission(event)" style="display: none;">
                <div class="input-group">
                    <input type="text" class="input-field" placeholder="Full Name" required>
                    <i class="fa-regular fa-user"></i>
                </div>
                <div class="input-group">
                    <input type="email" class="input-field" placeholder="Email Address" required>
                    <i class="fa-regular fa-envelope"></i>
                </div>
                <div class="input-group">
                    <input type="password" class="input-field" placeholder="Create Password" required>
                    <i class="fa-regular fa-lock"></i>
                </div>
                <button type="submit" class="btn-primary">Create Account</button>
            </form>

            <div class="divider">or continue with</div>
            <button type="button" class="btn-google" onclick="goToAdmission(event)">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Continue with Google
            </button>
        </div>

        <!-- 2. ADMISSION FORM PANEL -->
        <div id="admissionPanel" class="panel">
            <div class="brand-header">
                <h1>Student Admission Form</h1>
                <p>Session: 15th August 2026 - Dec</p>
            </div>

            <form onsubmit="submitAdmission(event)">
                <div class="input-group">
                    <input type="text" class="input-field" placeholder="Student Full Name" required>
                    <i class="fa-regular fa-id-badge"></i>
                </div>
                <div class="input-group">
                    <input type="text" class="input-field" placeholder="Father's Name" required>
                    <i class="fa-regular fa-user-tie"></i>
                </div>
                <div class="input-group">
                    <select id="classSelect" class="input-field" onchange="checkGroup()" required>
                        <option value="" disabled selected>Select Class</option>
                        <option value="6th">Class 6th</option>
                        <option value="7th">Class 7th</option>
                        <option value="8th">Class 8th</option>
                        <option value="9th">Class 9th</option>
                        <option value="10th">Class 10th</option>
                        <option value="11th">Class 11th</option>
                        <option value="12th">Class 12th</option>
                    </select>
                    <i class="fa-regular fa-graduation-cap"></i>
                </div>

                <div class="input-group" id="groupDiv" style="display: none;">
                    <select class="input-field">
                        <option value="" disabled selected>Select Group</option>
                        <option value="Medical">Medical</option>
                        <option value="Engineering">Engineering</option>
                    </select>
                    <i class="fa-regular fa-book"></i>
                </div>

                <div class="input-group">
                    <div class="file-box">
                        <input type="file" accept="image/*" required onchange="this.nextElementSibling.innerText = this.files[0].name">
                        <span>Upload Previous Class Certificate (Image)</span>
                    </div>
                </div>

                <div class="input-group" style="margin-bottom: 20px;">
                    <div class="file-box">
                        <input type="file" accept="image/*" required onchange="this.nextElementSibling.innerText = this.files[0].name">
                        <span>Upload Father's CNIC Copy (Image)</span>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Submit Application</button>
            </form>
        </div>
    </div>

    <script>
        function switchTab(tab, e) {
            document.querySelectorAll('.switch-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            if(tab === 'login') {
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('signupForm').style.display = 'none';
            } else {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('signupForm').style.display = 'block';
            }
        }

        function goToAdmission(e) {
            e.preventDefault();
            document.getElementById('authPanel').classList.remove('active');
            document.getElementById('admissionPanel').classList.add('active');
        }

        function checkGroup() {
            let cls = document.getElementById('classSelect').value;
            let groupDiv = document.getElementById('groupDiv');
            if(['10th', '11th', '12th'].includes(cls)) {
                groupDiv.style.display = 'block';
            } else {
                groupDiv.style.display = 'none';
            }
        }

        function submitAdmission(e) {
            e.preventDefault();
            alert("Application submitted successfully! Notification sent to kingbozdarjan@gmail.com. Redirecting to STBB...");
            window.location.href = "https://www.stbb.com.pk";
        }
    </script>
</body>
</html>
